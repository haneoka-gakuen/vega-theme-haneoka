name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: vega-theme-haneoka
      - uses: actions/checkout@v7
        with:
          repository: haneoka-gakuen/vega
          path: vega-theme-haneoka/.dependencies/vega
          ref: 2fa1b39c1176852db38a45b453c737e8e3439f5d
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-plugin-richtext
          path: vega-theme-haneoka/.dependencies/vega-plugin-richtext
          persist-credentials: false
          ref: c043823cbb2c63a6966343db2e9ef0fb8ba4b703
      - name: Check out Haneoka profile plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haneoka-gakuen/vega-plugin-haneoka
          path: vega-theme-haneoka/.dependencies/vega-plugin-haneoka
          persist-credentials: false
          ref: d02da4c16eee7413dbc07ade34ac288d05926456
      - uses: pnpm/action-setup@v6
        with:
          version: 11.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vega-theme-haneoka/pnpm-lock.yaml
      - name: Set up locked Rust/WASM tools
        uses: ./vega-theme-haneoka/.dependencies/vega/.github/actions/setup-wasm
      - working-directory: vega-theme-haneoka
        run: pnpm install --no-frozen-lockfile
      - working-directory: vega-theme-haneoka
        run: pnpm --filter @haneoka/vega-protocol build && pnpm --filter @haneoka/vega
          build:core
      - working-directory: vega-theme-haneoka
        run: pnpm --filter @haneoka/vega-plugin-richtext build
      - working-directory: vega-theme-haneoka
        run: pnpm --filter @haneoka/vega-plugin-haneoka build
      - working-directory: vega-theme-haneoka
        run: pnpm check
      - working-directory: vega-theme-haneoka
        run: pnpm pack --dry-run
